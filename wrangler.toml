name = "rivolo-app"
pages_build_output_dir = "./dist"
compatibility_date = "2026-06-21"

# Public identifiers only. Secrets (client secrets, token encryption keys)
# must NOT go here — set them as encrypted Secrets in the Cloudflare dashboard.
[vars]
GOOGLE_CLIENT_ID = "535138004412-dme8a9sitbamhg00jiln5eang5b7nf8s.apps.googleusercontent.com"
GOOGLE_ALLOWED_ORIGINS = "http://localhost:8788"
DROPBOX_CLIENT_ID = "u97wik4j3zxkssp"
DROPBOX_ALLOWED_ORIGINS = "http://localhost:8788"
MCP_OAUTH_ISSUER_URL = "https://rivolo.app/api/mcp/oauth"
MCP_RESOURCE_URL = "https://mcp.rivolo.app/mcp"
VITE_MCP_ENDPOINT = "https://mcp.rivolo.app/mcp"

[[d1_databases]]
binding = "MCP_DB"
database_name = "rivolo-mcp"
database_id = "3e6d7acf-18f7-4b22-aed2-cee616d791a4"
migrations_dir = "migrations"

[env.production.vars]
GOOGLE_CLIENT_ID = "535138004412-dme8a9sitbamhg00jiln5eang5b7nf8s.apps.googleusercontent.com"
GOOGLE_ALLOWED_ORIGINS = "https://rivolo.app"
DROPBOX_CLIENT_ID = "u97wik4j3zxkssp"
DROPBOX_ALLOWED_ORIGINS = "https://rivolo.app"
MCP_OAUTH_ISSUER_URL = "https://rivolo.app/api/mcp/oauth"
MCP_RESOURCE_URL = "https://mcp.rivolo.app/mcp"
VITE_MCP_ENDPOINT = "https://mcp.rivolo.app/mcp"

[[env.production.d1_databases]]
binding = "MCP_DB"
database_name = "rivolo-mcp"
database_id = "3e6d7acf-18f7-4b22-aed2-cee616d791a4"
migrations_dir = "migrations"

# Pages previews use the dev database, never the production database.
[env.preview.vars]
GOOGLE_CLIENT_ID = "535138004412-dme8a9sitbamhg00jiln5eang5b7nf8s.apps.googleusercontent.com"
DROPBOX_CLIENT_ID = "u97wik4j3zxkssp"
GOOGLE_ALLOWED_ORIGINS = "https://codex-mcp-experimental.rivolo.pages.dev,https://dev.rivolo.pages.dev"
DROPBOX_ALLOWED_ORIGINS = "https://codex-mcp-experimental.rivolo.pages.dev,https://dev.rivolo.pages.dev"
MCP_OAUTH_ISSUER_URL = "https://dev.rivolo.pages.dev/api/mcp/oauth"
