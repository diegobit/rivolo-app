name: Test
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  contracts-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e:built
      - run: npm run test:mcp-runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
