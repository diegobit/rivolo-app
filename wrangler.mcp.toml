name = "rivolo-mcp"
main = "mcp/worker.ts"
compatibility_date = "2026-06-21"
routes = [{ pattern = "mcp.rivolo.app", custom_domain = true }]

[triggers]
crons = ["0 3 * * *"]

[[d1_databases]]
binding = "MCP_DB"
database_name = "rivolo-mcp"
database_id = "3e6d7acf-18f7-4b22-aed2-cee616d791a4"
migrations_dir = "migrations"

[vars]
GOOGLE_CLIENT_ID = "535138004412-dme8a9sitbamhg00jiln5eang5b7nf8s.apps.googleusercontent.com"
DROPBOX_CLIENT_ID = "u97wik4j3zxkssp"
MCP_ALLOWED_ORIGINS = "https://mcp.rivolo.app"
MCP_OAUTH_ISSUER_URL = "https://rivolo.app/api/mcp/oauth"
MCP_RESOURCE_URL = "https://mcp.rivolo.app/mcp"

# Isolated dev Worker; production remains the top-level configuration.
[env.dev]
name = "rivolo-mcp-dev"
workers_dev = false
routes = [{ pattern = "mcp-dev.rivolo.app", custom_domain = true }]

[env.dev.triggers]
crons = ["0 3 * * *"]

[env.dev.vars]
GOOGLE_CLIENT_ID = "535138004412-dme8a9sitbamhg00jiln5eang5b7nf8s.apps.googleusercontent.com"
DROPBOX_CLIENT_ID = "u97wik4j3zxkssp"
MCP_ALLOWED_ORIGINS = "https://mcp-dev.rivolo.app"
MCP_OAUTH_ISSUER_URL = "https://dev.rivolo.pages.dev/api/mcp/oauth"
MCP_RESOURCE_URL = "https://mcp-dev.rivolo.app/mcp"

[[env.dev.d1_databases]]
binding = "MCP_DB"
database_name = "rivolo-mcp-dev"
database_id = "c5596649-3ab7-46db-8947-54135c085c3b"
migrations_dir = "migrations"
